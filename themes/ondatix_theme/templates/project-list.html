{% extends "base.html" %}
{% block hero %}
<div class="hero bg-dark">
    <div class="container">
        <div class="container-wrapper">
            <div class="project-header">
                <h1 class="project-title">{{ section.title }}</h1>
            </div>
        </div>
    </div>
</div>
{% endblock hero %}
{% block content %}
<div class="container">
    <div class="container-wrapper">
        <div class="project-list">
            {% for project in section.pages %}
            {{ <project_card project={project} /> }}
            {% endfor %}
        </div>
    </div>
</div>
{% endblock content %}
{% block extra_javascript %}
{{ <include_script file="js/project-list.js" config={config} /> }}
{% endblock extra_javascript %}
