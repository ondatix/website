{% extends "project-list.html" %}
{% block hero %}
<div class="hero bg-dark">
    <div class="container">
        <div class="container-wrapper">
            <div class="project-header">
                <div class="back-to-projects">
                    <a href="{{ get_url(path='@/projekte/_index.md') }}"><span>&lt; Zurück zu allen Projekten</span></a>
                </div>
                <h1 class="project-title">{{ term.name }}</h1>
            </div>
        </div>
    </div>
</div>
{% endblock hero %}
{% block content %}
<div class="container">
    <div class="container-wrapper">
        <div class="project-list">
            {% for project in term.pages %}
            {{ <project_card project={project} /> }}
            {% endfor %}
        </div>
    </div>
</div>
{% endblock content %}
