{% component sliding_cards(data_path, config) %}
{% set data = load_data(path=data_path) %}


<div  class="container bg-light">

<div class="sticky-cards container">
{%- for card in data.card%}
    {{ <card title={card.title} content={card.content} type={card.type} color={card.color} /> }}
{%- endfor %}
</div>

</div>

<script
    src="{{ <base_path config={config} /> }}js/sticky-cards.js"
></script>
{% endcomponent %}
