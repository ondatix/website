name: Deploy Zola site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Install Zola
        run: |
          ZOLA_VERSION=0.23.6
          curl -sL https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Build site
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # mittwald deployment (disabled). To switch back, uncomment this step
      # and drop the GitHub Pages steps/job.
      # zerodeploy builds the container from public/ (Railpack detects
      # the static index.html) and deploys it.
      # - name: Deploy with zerodeploy
      #   uses: mittwald/zerodeploy-action@v2
      #   with:
      #     mittwald-api-token: ${{ secrets.MITTWALD_API_TOKEN }}
      #     mittwald-project-id: "p-rh9pen"
      #     repo-subpath: ./public
      #     service-name: website
      #     image-tag: ${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
